services:
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        sync: false
      - key: MYSQL_URL
        value: mysql://root:eXLTbyJRQNyURugmvaHahdPIEMWbwODw@altaria.proxy.rlwy.net:17441/railway
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_JOB_ATTEMPTS
        value: "3"
      - key: EMAIL_JOB_BACKOFF_DELAY
        value: "1000"
